spring.application.name=spendwise


spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spendwise}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:Computer78**}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP


server.port=${PORT:8080}


jwt.secret=${JWT_SECRET:spendwise-super-secret-key-change-this-in-production-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}